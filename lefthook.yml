# Git hooks, installed by `lefthook install`, which the package.json prepare
# script runs on every `bun install`.
#
# Every job resolves its tool with `bunx --bun --no-install`, which fetches
# nothing at commit time. When the checkout's package is installed, it always
# runs, at the version bun.lock pins. When it is missing, bunx runs a tool of
# the same name from PATH, from a parent directory's node_modules/.bin or from
# its own cache under the temporary directory, and exits 1 only when none
# exists. CI's gate job, which installs from the lockfile, is the control for
# that case. --bun runs the tool under Bun. Without it, bunx runs a bin whose
# first line names node under the `node` on PATH.
# When node_modules is gone, lefthook itself is missing and the commit goes
# through. CONTRIBUTING.md#setup says what holds that case.

pre-commit:
  jobs:
    # Order matters: lint fixes land before formatting, and both re-stage
    # their changes. Each job sees the staged files its glob matches alone, so
    # a commit that touches none of them skips it.
    - name: eslint
      glob: '*.{ts,mts,js}'
      # --config names the one config, so no eslint.config.* nearer a staged file
      # runs. --no-warn-ignored: a staged file the config's ignores name, such as
      # a generated one, passes rather than warning past --max-warnings=0.
      run: bunx --bun --no-install eslint --config eslint.config.ts --fix --max-warnings=0 --no-warn-ignored {staged_files}
      stage_fixed: true
    # --config names the one config, so no other Prettier config file loads,
    # and --no-editorconfig keeps any .editorconfig from setting an option.
    # --ignore-path names .prettierignore alone, so .gitignore never skips a
    # staged file.
    - name: prettier
      run: bunx --bun --no-install prettier --config .prettierrc --no-editorconfig --ignore-path .prettierignore --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    # {1} is the message file git hands the hook. The type list comes from the
    # Conventional Commits specification and the scopes from
    # .github/commit-scopes.json, both by way of commitlint.config.js, which
    # --config names, so commitlint searches for no other config.
    - name: commitlint
      run: bunx --bun --no-install commitlint --config commitlint.config.js --edit {1}

pre-push:
  jobs:
    # The gate without its slow rows, which CI runs whole on three platforms.
    # It runs over the working tree, so uncommitted edits count toward the
    # result. It runs by its file, not through bun run, so no node_modules/.bin
    # sits ahead of PATH before the gate refuses a tracked node_modules path.
    - name: check
      run: bun scripts/check.ts --quick
