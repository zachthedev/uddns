name: Release

# A push to main updates one open release pull request; it does not cut a
# version. That pull request carries the version bump and the changelog entries
# for everything landed since the last release, so merging it is the act that
# releases. release-please then tags the merge commit, publishes the GitHub
# Release, and the deploy job below ships that revision.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two pushes landing together would otherwise race to write the same release
# pull request. Queued rather than cancelled, so the later push still gets its
# commits into the release notes.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  # Ahead of the release, not after it. A tag and a GitHub Release cannot be
  # withdrawn once published, so the only useful place for the gate is before
  # they exist. The release pull request carries checks of its own, because the
  # app token below is what opens it, so this covers the push to main itself.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check:all

  release:
    name: Release PR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every credential this job uses comes from the app, so the job token gets
    # nothing.
    permissions: {}
    # Holds the releaser app's credentials and admits main alone, through a
    # deployment branch policy naming main. No reviewer: an approval here would
    # stall every release. deployment: false, because this is a credential
    # scope rather than a deployment target, and a record for every push to
    # main would bury the ones deploy.yml writes against production.
    environment:
      name: release-pr
      deployment: false
    outputs:
      released: ${{ steps.release-please.outputs.release_created }}

    steps:
      # A pull request opened by GITHUB_TOKEN has its CI run held at
      # action_required with no jobs, so no check reaches the release commit
      # until somebody approves it by hand. The app is a distinct actor, so its
      # pull request starts a run the moment it is opened.
      #
      # Narrowed with permission-* inputs. Without one the token inherits every
      # permission the installation holds, which is the whole app rather than
      # the two scopes release-please works through.
      - name: Mint app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          # The release branch and its commits, and the tag and the GitHub
          # Release that merging the pull request produces.
          permission-contents: write
          # The release pull request itself, and the `autorelease:` labels
          # release-please tracks it with. Labels on a pull request fall under
          # this permission, not under issues.
          permission-pull-requests: write

      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    name: Deploy
    needs: release
    if: needs.release.outputs.released == 'true'
    # deploy.yml answers to workflow_call and workflow_dispatch alone, so the
    # release tag reaches it only through this call. One deploy definition,
    # rather than a second copy of the steps behind a tag trigger.
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_PREVIEW_ID: ${{ secrets.KV_NAMESPACE_PREVIEW_ID }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
