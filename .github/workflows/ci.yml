name: CI

permissions: {}

on:
  # Every pull request, whatever it targets. A stacked pull request is based on
  # the layer below it rather than on main, and filtering by base branch leaves
  # each middle layer reviewed with no checks against it.
  pull_request:
  push:
    branches: [main]

jobs:
  # The gate a contributor runs locally, called and never restated, so the two
  # cannot drift. bun run check:rows prints what it covers. It asserts mise.lock
  # against mise.toml, then installs the tools, then runs every check, in that
  # order by construction.
  gate:
    name: gate
    strategy:
      # One platform failing still reports the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to packageManager, so a bun release cannot change what these
          # checks mean without a commit that says so.
          bun-version-file: package.json

      # mise alone, verified against the release's signed checksums. install:
      # false, because the gate asserts mise.lock before it installs from it,
      # and an install here would put the bytes on disk before the assertions
      # read the file. cache: false for the same reason: nothing restored ahead
      # of the assertions.
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: false
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GH_TOKEN, so the gate's zizmor runs online here as it does for a
      # contributor whose gh auth token succeeds. The job token is read-only.
      - name: Verify
        run: bun run check
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs in CI alone: the scan needs the pull request's base and head commits
  # and the official action, which no working machine has. GitHub push
  # protection covers provider patterns; trufflehog adds its own detectors and
  # live verification.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No base or head input: the action then scans the pull request's
      # base..head commits, or a push's before..after. A branch name as base
      # does not resolve in a pull request checkout, and the scan reads nothing.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          # The action runs the scanner from a Docker image tagged with this
          # input, which defaults to latest. Pinning the SHA above fixes only
          # the action's own script, so the image is pinned here by digest.
          version: 3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076

  # The three shared checks, called from zachthedev/.github at a release SHA. Each header
  # names its inputs; the pin moves through Renovate's zachthedev group with no cooldown.
  commits:
    uses: zachthedev/.github/.github/workflows/commits.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      contents: read

  workflows:
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      contents: read

  # Blocks on what a pull request adds against its base, and on what a release adds against
  # the last tag, at high severity. Under Bun it sees the exactly pinned direct packages and
  # the actions, not bun.lock's transitives; the audit workflow reports on those daily.
  # allow-ghsas stays empty; a waiver is a GHSA id here with a comment naming the advisory,
  # what it blocks, why shipping is safer and what removes it (CONTRIBUTING.md#dependencies).
  dependency-review:
    uses: zachthedev/.github/.github/workflows/dependency-review.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      contents: read
