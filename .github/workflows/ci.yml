name: CI

permissions:
  contents: read

on:
  # Every pull request, whatever it targets. A stacked pull request is based on
  # the layer below it rather than on main, and filtering by base branch leaves
  # each middle layer reviewed with no checks against it.
  pull_request:
  push:
    branches: [main]

jobs:
  # First in the file so a message problem is the first failure a contributor
  # sees. It needs nothing and nothing needs it.
  commits:
    name: Commit Messages
    runs-on: ubuntu-latest
    # Every step below reads `github.event.pull_request`, which a push to main
    # does not carry. No author is excused: a release commit is a one-line
    # `chore(main): release x.y.z`, and the changelog goes to CHANGELOG.md and
    # the pull request body, neither of which commitlint reads.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint walks base..head, so the range has to be present. A
          # shallow clone leaves it with nothing to read.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A rebase merge lands these subjects unchanged, so they are linted as
      # written. A squash merge discards them for the subject below.
      - name: Lint the pull request commits
        run: bun node_modules/@commitlint/cli/cli.js --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      # A squash merge builds the subject from the title with the number
      # appended, so composing the two lints the string that reaches main
      # rather than the shorter one a reviewer reads. Both values arrive
      # through the environment and reach commitlint on stdin, so neither is
      # ever a shell word.
      - name: Lint the squash subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)' "$PR_TITLE" "$PR_NUMBER" | bun node_modules/@commitlint/cli/cli.js --verbose

  checks:
    name: Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to packageManager, so a bun release cannot change what these
          # checks mean without a commit that says so.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The gate a contributor runs locally, called rather than restated, so
      # the two cannot drift. A check belongs in the check script, not here.
      # The test job owns the test leg, which is why this calls check rather
      # than check:all.
      - name: Verify
        run: bun run check

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      # Posting the summary needs pull-requests: write against an open pull
      # request, which is why the coverage run sits here rather than in the
      # gate.
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0

  build:
    name: Deploy Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Worker (dry run)
        run: bun scripts/deploy.ts --dry-run

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # bun audit reads bun.lock, so this job needs bun but not an install.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # An advisory is a function of the world rather than of the tree, so it
      # cannot sit in the gate. A pull request is where blocking is right: the
      # fix is a version bump and the author is here to make it.
      - name: Audit dependencies
        run: bun run audit

      # Renovate moves the action and this image together, and reads the digest
      # from Docker Hub, because its docker datasource reads a release timestamp
      # only from there. With minimumReleaseAgeBehaviour set to
      # timestamp-required, a ghcr.io lookup has no timestamp to clear the
      # cooldown with and would never move. This asserts that ghcr.io, which is
      # what the action pulls, publishes that same digest for the action's
      # release. Upstream builds the image once per registry, so agreement is a
      # property of those builds and not of a mirror.
      #
      # The release and the pin are read from this file, each anchored to its
      # key so a comment quoting either line is not a second value, and each
      # must occur exactly once. A pin that trails upstream passes, because the
      # two are compared to each other and not to the newest tag.
      #
      # The read is the registry HTTP API under an anonymous pull token, the
      # exchange a pull opens with, so it needs no daemon. No response, 408,
      # 429 and 5xx are the transport class: three attempts, then a warning,
      # and the comparison is skipped. Every other status is a definitive
      # answer and is not retried. A 200 with a different digest is the
      # condition and fails the job. Any other definitive answer with no
      # digest, a 404 or a redirect included, fails the job too, because a
      # step that warns on a permanent answer is a step that is off. The scan
      # below pulls this image by digest from this registry, so an outage
      # fails there in any case. A skipped comparison cannot run an image
      # ghcr.io does not hold at the pinned digest; it could run one ghcr.io
      # holds under another tag, and failing on a definitive 404 is what keeps
      # that from passing quietly.
      #
      # Both index media types are offered. ghcr.io answers 404 to a request
      # for an OCI index that offers only the Docker list type, so a narrower
      # header would fail this step on the day upstream publishes an index.
      - name: Check the scanner image matches the action release
        run: |
          release=$(sed -nE 's|^ +uses: trufflesecurity/trufflehog@[0-9a-f]{40} # v([0-9]+\.[0-9]+\.[0-9]+)$|\1|p' .github/workflows/ci.yml)
          pinned=$(sed -nE 's|^ +version: [0-9]+\.[0-9]+\.[0-9]+@(sha256:[0-9a-f]{64})$|\1|p' .github/workflows/ci.yml)
          release_count=$(printf '%s\n' "$release" | awk 'NF { n++ } END { print n + 0 }')
          pinned_count=$(printf '%s\n' "$pinned" | awk 'NF { n++ } END { print n + 0 }')
          if [ "$release_count" -ne 1 ] || [ "$pinned_count" -ne 1 ]; then
            echo "::error::ci.yml must name the trufflehog release once and its image pin once; found ${release_count} release line(s) and ${pinned_count} pin line(s)."
            exit 1
          fi
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'
          published=''
          definitive=''
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then sleep 5; fi
            token=$(curl -sS --max-time 20 'https://ghcr.io/token?scope=repository:trufflesecurity/trufflehog:pull' | jq -r '.token // empty') || token=''
            if [ -z "$token" ]; then
              answer='no token'
              continue
            fi
            response=$(curl -sS --max-time 20 -I -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" "https://ghcr.io/v2/trufflesecurity/trufflehog/manifests/${release}") || response=''
            status=$(printf '%s\n' "$response" | sed -n '1s|^HTTP/[0-9.]* \([0-9]\{3\}\).*|\1|p')
            if [ -z "$status" ]; then
              answer='no response'
              continue
            fi
            answer="HTTP ${status}"
            case "$status" in
              408 | 429 | 5??) continue ;;
            esac
            definitive=1
            digest=$(printf '%s\n' "$response" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
            case "${status}:${digest}" in
              "200:sha256:"*) published=$digest ;;
            esac
            break
          done
          if [ -z "$definitive" ]; then
            echo "::warning::ghcr.io returned no digest for trufflehog ${release} in 3 attempts (last: ${answer}); the image pin was not compared."
            exit 0
          fi
          if [ -z "$published" ]; then
            echo "::error::ghcr.io answered ${answer} for trufflehog ${release} and returned no digest."
            exit 1
          fi
          if [ "$pinned" != "$published" ]; then
            echo "::error::trufflehog image pin is '${pinned}', but ghcr.io publishes '${published}' for release ${release}."
            exit 1
          fi
          echo "trufflehog ${release} pin matches ghcr.io: ${published}"

      # No base or head input: the action then scans the pull request's
      # base..head commits, or a push's before..after. A branch name as base
      # does not resolve in a pull request checkout, and the scan reads nothing.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          # The action runs the scanner from a Docker image tagged with this
          # input, which defaults to latest. Pinning the SHA above fixes only
          # the action's own script, so the image is pinned here by digest.
          version: 3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076
