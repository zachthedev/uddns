name: CI

permissions:
  contents: read

on:
  # Every pull request, whatever it targets. A stacked pull request is based on
  # the layer below it rather than on main, and filtering by base branch leaves
  # each middle layer reviewed with no checks against it.
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, Format & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to packageManager, so a bun release cannot change what these
          # checks mean without a commit that says so.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting
        run: bun run format:check

      - name: Run ESLint
        run: bun run lint

      - name: TypeScript type checking
        run: bun run typecheck

      # wrangler types includes secret names from .dev.vars; materialize it
      # from the committed template so typegen is deterministic everywhere.
      - name: Check generated types are current
        run: |
          cp .dev.vars.template .dev.vars
          bun run cf-typegen
          git diff --exit-code worker-configuration.d.ts

      - name: Check committed config is clean
        run: bun scripts/check-placeholders.ts

      - name: Check the dependency cooldown
        run: bun scripts/check-cooldown.ts

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0

  build:
    name: Deploy Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Worker (dry run)
        run: bun scripts/deploy.ts --dry-run

  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      # Renovate moves the action and this image together, and reads the digest
      # from Docker Hub, because ghcr.io returns no release timestamp and the
      # cooldown would hold a ghcr.io lookup forever. This asserts that ghcr.io,
      # which is what the action pulls, publishes that same digest for the
      # action's release.
      - name: Check the scanner image matches the action release
        run: |
          release=$(sed -nE 's|.*trufflesecurity/trufflehog@[0-9a-f]{40} # v([0-9.]+)$|\1|p' .github/workflows/ci.yml)
          pinned=$(sed -nE 's|.* version: [0-9]+\.[0-9]+\.[0-9]+@(sha256:[0-9a-f]{64})$|\1|p' .github/workflows/ci.yml)
          published=$(docker buildx imagetools inspect "ghcr.io/trufflesecurity/trufflehog:${release}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ -z "$pinned" ] || [ "$pinned" != "$published" ]; then
            echo "trufflehog image pin is '${pinned}', but release ${release} publishes '${published}'." >&2
            exit 1
          fi

      # No base or head input: the action then scans the pull request's
      # base..head commits, or a push's before..after. A branch name as base
      # does not resolve in a pull request checkout, and the scan reads nothing.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          # The action runs the scanner from a Docker image tagged with this
          # input, which defaults to latest. Pinning the SHA above fixes only
          # the action's own script, so the image is pinned here by digest.
          version: 3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076
