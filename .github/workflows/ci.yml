name: CI

permissions: {}

on:
  # Every pull request, whatever it targets. A stacked pull request is based on
  # the layer below it rather than on main, and filtering by base branch leaves
  # each middle layer reviewed with no checks against it.
  pull_request:
  push:
    branches: [main]

# The four pins keep jdx/mise-action's own mise commands to mise.toml. The
# gate starts every mise command it runs with these and the rest of its own
# environment, never with the job's.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ''
  MISE_AUTO_ENV: 'false'

jobs:
  # The gate a contributor runs locally, called and never restated, so the two
  # cannot drift. bun run check:rows prints what it covers. Its tools row
  # asserts mise.lock against mise.toml and then installs, in that order by
  # construction. No step here names a token, so the gate's zizmor runs
  # offline, and zizmor's online audits run in the workflows job below.
  gate:
    name: gate
    strategy:
      # One platform failing still reports the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # Before the checkout, because the action runs mise --version and mise ls
      # in a workspace it trusts, and a pull request's mise.toml would load
      # there before the gate refuses it. mise alone, verified against the
      # release's signed checksums, and its bin directory stays on PATH.
      # install: false, because the gate asserts mise.lock before it installs
      # from it. cache: false for the same reason: nothing restored ahead of the
      # assertions. github_token: '', because a locked install makes no GitHub
      # API request, and the default exports the job token as MISE_GITHUB_TOKEN
      # to every later step. env: false and export_path: false, so nothing
      # mise.toml sets reaches a later step: the gate runs each tool by the path
      # mise which prints.
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: false
          cache: false
          github_token: ''
          env: false
          export_path: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to packageManager, so a bun release cannot change what these
          # checks mean without a commit that says so.
          bun-version-file: package.json

      # --ignore-scripts, so nothing in the tree runs before the gate: the
      # root's prepare installs git hooks, which CI never runs, and a
      # dependency's install script only checks or relinks a native binary the
      # gate's tools find without it.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The file itself, not `bun run check`: the script runner puts the
      # checkout's node_modules/.bin ahead of PATH, where a committed bun would
      # run in place of the gate, and the gate refuses a tracked node_modules
      # path before any row.
      - name: Verify
        run: bun scripts/check.ts

  # Runs in CI alone: the scan needs the pull request's base and head commits
  # and the official action, which no working machine has. GitHub push
  # protection covers provider patterns; trufflehog adds its own detectors and
  # live verification.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No base or head input: the action then scans the pull request's
      # base..head commits, or a push's before..after. A branch name as base
      # does not resolve in a pull request checkout, and the scan reads nothing.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          # The action runs the scanner from a Docker image tagged with this
          # input, which defaults to latest. Pinning the SHA above fixes only
          # the action's own script, so the image is pinned here by digest.
          version: 3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076

  # The three shared checks, called from zachthedev/.github at a release SHA. Each header
  # names its inputs; the pin moves through Renovate's zachthedev group with no cooldown.
  commits:
    uses: zachthedev/.github/.github/workflows/commits.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      contents: read

  workflows:
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      contents: read

  # Blocks on what a pull request adds against its base, and on what a release adds against
  # the last tag, at high severity. Under Bun it sees the exactly pinned direct packages and
  # the actions, not bun.lock's transitives; the audit workflow reports on those daily.
  # allow-ghsas stays empty; a waiver is a GHSA id here with a comment naming the advisory,
  # what it blocks, why shipping is safer and what removes it (CONTRIBUTING.md#dependencies).
  dependency-review:
    uses: zachthedev/.github/.github/workflows/dependency-review.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      contents: read
