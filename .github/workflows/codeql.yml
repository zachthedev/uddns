name: codeql

# Code scanning as advanced setup, which is this file, rather than as default setup, which is a
# switch on the repository settings page and leaves nothing in the tree. The analysis itself is the
# reusable workflow in zachthedev/.github, pinned by commit; this file says when it runs and over
# which languages.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a query published after the last change to this repository still reports against
  # this tree. Thursday, clear of deps.yml's daily cron and of audit.yml's.
  schedule:
    - cron: '37 9 * * 4'

permissions: {}

jobs:
  # Two languages. javascript-typescript is one extractor over the Worker, its tests, its scripts
  # and the JavaScript config files. actions covers the workflows under .github. The reusable
  # workflow adds no language of its own, so both are named here. The check runs are
  # `codeql / Analyze (<language>)`, which is what a branch ruleset requires.
  codeql:
    uses: zachthedev/.github/.github/workflows/codeql.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      languages: '[{"language":"javascript-typescript"},{"language":"actions"}]'
