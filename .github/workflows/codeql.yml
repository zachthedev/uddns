name: codeql

# Code scanning from a committed workflow, never default setup. The reusable workflow runs one
# analysis per language listed below and names each check run Analyze (<language>), so the
# default-branch checks ruleset can require them by name. Both languages here run with build
# mode none, and codeql-action's fallback to autobuild covers C# and Java alone, so a run's
# conclusion stands on its own.
on:
  push:
    branches: [main]
  pull_request:
  # At least once a week, so a query published after the last change still reports against
  # this tree. Thursday, clear of deps.yml's daily cron and audit.yml's.
  schedule:
    - cron: '37 9 * * 4'

permissions: {}

jobs:
  # javascript-typescript is one extractor over the source, the tests, the scripts and the
  # JavaScript config files. actions covers the workflows under .github. The reusable workflow
  # adds no language of its own, so both are named here. The called job gets at most what is
  # granted here.
  codeql:
    permissions:
      # Uploading the results to code scanning.
      security-events: write
      # Reading the checkout.
      contents: read
      # Reading the run's metadata, which a private repository needs for the upload.
      actions: read
    uses: zachthedev/.github/.github/workflows/codeql.yml@ec458567a7200c4ad96ed0c7556e06bc2b287738 # v0.3.0
    with:
      languages: '[{"language":"javascript-typescript"},{"language":"actions"}]'
