name: audit

# The whole-tree reports, on one daily clock. A red run is a report, never a check: it means work
# to pick up. Nothing merges, releases or deploys through this file. The pull request checks in
# ci.yml hold what a change adds. This file reports what the world found about the tree since.
#
# bun audit reads every package in bun.lock, transitives included, against the live database and
# exits non-zero at or above its audit level. The work is a direct bump through Renovate's next
# security fix or a transitive one by hand with bun audit fix.
#
# The workflows job runs zizmor's online audits over the pinned actions: a pinned commit outside
# its action's repository, a stale action ref, a known-vulnerable action. Those answers change
# with no pull request, so a schedule is what asks again.
on:
  schedule:
    # At least once a day. The hour is clear of deps.yml's cron.
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun audit reads bun.lock, so the job needs Bun and no install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The verdict is a claim about an external database, and a clean verdict names no
      # endpoint. bun audit has no --registry flag, and this variable outranks bunfig.toml and
      # a dotenv, so setting it here fixes the endpoint for the run.
      # The package.json audit script, as the handbook's Advisories section runs it: it sets the
      # high audit level, and it is the one home of the --ignore waivers
      # CONTRIBUTING.md#dependencies records, so both apply to the daily report too.
      - run: bun run audit
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

  # The calling job grants what the called job declares.
  workflows:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@09a9a00aae657ea11e5d5979ef3ce5859d9aba3a # v0.2.0
