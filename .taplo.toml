# Every TOML file this repository authors, formatted by `taplo fmt`. The gate
# runs `taplo fmt --check --config .taplo.toml`. mise.lock is written by
# `mise lock` and carries no .toml extension, so the pattern leaves it alone.
# taplo reads no .gitignore, so this exclude list is the one control over what
# it walks: node_modules, and Claude Code's worktrees, each of which holds its
# own copy of every file here.
include = ["**/*.toml"]
# Deviates from the handbook: .wrangler/ is wrangler's build output, which
# the Bun kickstart's list does not name.
exclude = ["node_modules/**", ".claude/worktrees/**", ".wrangler/**"]
